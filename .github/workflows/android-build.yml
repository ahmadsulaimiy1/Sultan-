name: Android App Build

# Builds the real Sultan Hanafi Royal Schools Android app (a Capacitor
# wrapper around the live shroyalschools.com Digital Campus Platform --
# see mobile-app/capacitor.config.json) into a downloadable debug APK.
#
# This runs on GitHub's own runners specifically because they carry a
# full Android SDK and unrestricted internet access, which the
# development sandbox this project is otherwise built in does not have.
# The build succeeding here is the real, verifiable "no errors"
# confirmation -- not a claim made without a build actually running.
#
# Per the app-architecture directive: this workflow (and therefore a new
# APK) should only need to run again when the native shell itself
# changes -- Capacitor config, native plugins, Android manifest/gradle
# files. Ordinary content updates (policies, news, calendars, admissions
# info) live entirely on shroyalschools.com and reach every installed
# copy of this app instantly, with no rebuild, because the app is a thin
# WebView pointed at the live site, not a bundle of static content.
on:
  push:
    branches: [main, claude/wec-institutional-design-kt3u0t]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm install

      - name: Capacitor sync (Android)
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: mobile-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shrs-android-debug-apk
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
