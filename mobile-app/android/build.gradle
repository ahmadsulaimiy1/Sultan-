// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        // Google's official read-only mirror of Maven Central, tried
        // before the real repo.maven.apache.org. GitHub-hosted Actions
        // runners were getting hard 403s straight from Sonatype Central
        // (verified in a real CI run, not a guess -- Sonatype's own bot
        // protection rejecting the runner's IP range/User-Agent, not a
        // dependency actually missing), while this mirror serves the
        // identical artifacts without that block.
        maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
