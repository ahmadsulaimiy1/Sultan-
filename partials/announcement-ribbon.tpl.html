<div class="ann-ribbon" data-ann-ribbon aria-live="polite">
  <div class="wrap ann-ribbon-inner">
    <span class="ann-ribbon-tag" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="14" height="14"><path d="M4 10a8 8 0 0116 0v4l2 3H2l2-3v-4z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M9.5 20a2.5 2.5 0 005 0" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      {{t:footer.notices}}
    </span>
    <div class="ann-ribbon-track" data-ann-ribbon-track>
      <p class="ann-ribbon-empty" data-ann-ribbon-empty>{{t:ann.empty}}</p>
    </div>
    <a href="/announcements/" class="ann-ribbon-viewall">{{t:ann.viewAll}} <span class="arrow">→</span></a>
  </div>
</div>
