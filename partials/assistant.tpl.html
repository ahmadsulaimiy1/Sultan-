<div class="assistant-root" data-assistant>
  <button class="assistant-launcher" data-assistant-toggle aria-label="{{t:as.open}}" aria-expanded="false">
    <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true"><path d="M4 6h24v15H12l-6 6v-6H4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
  </button>
  <div class="assistant-panel" data-assistant-panel hidden>
    <div class="assistant-head" data-assistant-head>
      <div>
        <span class="assistant-head-title">{{t:as.title}}</span>
        <span class="assistant-head-sub">{{t:as.sub}}</span>
      </div>
      <div class="assistant-head-actions">
        <button type="button" class="assistant-icon-btn" data-assistant-new title="{{t:as.new}}" aria-label="{{t:as.new}}">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 4v6h6M20 20v-6h-6M5.5 15a7 7 0 0012.9 2.2M18.5 9A7 7 0 005.6 6.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="assistant-icon-btn" data-assistant-minimize title="{{t:as.min}}" aria-label="{{t:as.minAria}}" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button type="button" class="assistant-icon-btn" data-assistant-fullscreen title="{{t:as.full}}" aria-label="{{t:as.full}}" aria-pressed="false">
          <span class="icon-expand"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="icon-compress"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </button>
        <button class="assistant-close" data-assistant-close aria-label="{{t:as.close}}">&#10005;</button>
      </div>
    </div>
    <div class="assistant-body" data-assistant-body>
      <p class="assistant-disclosure" data-assistant-disclosure>{{t:as.disclosure}}</p>
      <div class="assistant-messages" data-assistant-messages></div>
      <div class="assistant-starters" data-assistant-starters></div>
      <div class="assistant-attachment" data-assistant-attachment hidden>
        <span data-assistant-attachment-label></span>
        <button type="button" data-assistant-attachment-remove aria-label="{{t:as.removeAtt}}">&#10005;</button>
      </div>
      <form class="assistant-composer" data-assistant-form>
        <div class="assistant-composer-row">
          <button type="button" class="assistant-icon-btn" data-assistant-upload-btn title="{{t:as.attach}}" aria-label="{{t:as.attach}}">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8 12l4-4 4 4M12 8v9M4 20h16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <input type="file" data-assistant-upload hidden accept=".txt,text/plain,.pdf,application/pdf,.docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document,image/*" />
          <button type="button" class="assistant-icon-btn" data-assistant-mic title="{{t:as.speak}}" aria-label="{{t:as.speak}}" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 15a3 3 0 003-3V6a3 3 0 00-6 0v6a3 3 0 003 3zm5-3a5 5 0 01-10 0M12 18v3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <textarea class="assistant-input" data-assistant-input rows="1" placeholder="{{t:as.placeholder}}" aria-label="{{t:as.placeholder}}" required></textarea>
          <button type="submit" class="assistant-send-btn" data-assistant-send aria-label="{{t:as.send}}">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 12l16-7-6 16-2.5-6.5L4 12z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          </button>
          <button type="button" class="assistant-send-btn assistant-stop-btn" data-assistant-stop hidden aria-label="{{t:as.stop}}">
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="5" y="5" width="14" height="14" fill="currentColor"/></svg>
          </button>
        </div>
        <div class="assistant-composer-footer">
          <button type="button" class="assistant-text-btn" data-assistant-speak-toggle aria-pressed="false">{{t:as.readAloud}}</button>
          <button type="button" class="assistant-text-btn" data-assistant-contact-toggle>{{t:as.talk}}</button>
        </div>
      </form>
    </div>
  </div>
</div>

    <a class="whatsapp-menu-item" href="https://wa.me/2348073747650?text=Hello%2C%20I%27d%20like%20to%20ask%20about%20the%20boarding%20facility." target="_blank" rel="noopener">

    <a class="whatsapp-menu-item" href="https://wa.me/2348073747650?text=Hello%2C%20I%20have%20a%20general%20enquiry%20for%20Sultan%20Hanafi%20Royal%20Schools." target="_blank" rel="noopener">

    </a>
  </div>
</div>
