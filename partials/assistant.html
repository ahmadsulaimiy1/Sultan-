<div class="assistant-root" data-assistant>
  <button class="assistant-launcher" data-assistant-toggle aria-label="Open the digital academic assistant" aria-expanded="false">
    <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true"><path d="M4 6h24v15H12l-6 6v-6H4z" fill="none" stroke="#E9CE8A" stroke-width="1.6" stroke-linejoin="round"/></svg>
  </button>
  <div class="assistant-panel" data-assistant-panel hidden>
    <div class="assistant-head">
      <div>
        <span class="assistant-head-title">Digital Academic Assistant</span>
        <span class="assistant-head-sub">Sultan Hanafi Royal Schools</span>
      </div>
      <div class="assistant-head-actions">
        <button type="button" class="assistant-icon-btn" data-assistant-new title="New conversation" aria-label="New conversation">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 4v6h6M20 20v-6h-6M5.5 15a7 7 0 0012.9 2.2M18.5 9A7 7 0 005.6 6.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="assistant-close" data-assistant-close aria-label="Close">&#10005;</button>
      </div>
    </div>
    <p class="assistant-disclosure" data-assistant-disclosure>I'm an AI assistant, not a staff member — I can answer questions about the school and help with schoolwork, but for anything official please use the contact details below.</p>
    <div class="assistant-messages" data-assistant-messages></div>
    <div class="assistant-starters" data-assistant-starters></div>
    <div class="assistant-attachment" data-assistant-attachment hidden>
      <span data-assistant-attachment-label></span>
      <button type="button" data-assistant-attachment-remove aria-label="Remove attachment">&#10005;</button>
    </div>
    <form class="assistant-composer" data-assistant-form>
      <div class="assistant-composer-row">
        <button type="button" class="assistant-icon-btn" data-assistant-upload-btn title="Attach a document or image" aria-label="Attach a document or image">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8 12l4-4 4 4M12 8v9M4 20h16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <input type="file" data-assistant-upload hidden accept=".txt,text/plain,.pdf,application/pdf,.docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document,image/*" />
        <button type="button" class="assistant-icon-btn" data-assistant-mic title="Speak your question" aria-label="Speak your question" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 15a3 3 0 003-3V6a3 3 0 00-6 0v6a3 3 0 003 3zm5-3a5 5 0 01-10 0M12 18v3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <textarea class="assistant-input" data-assistant-input rows="1" placeholder="Ask about admissions, programmes, or get help with schoolwork…" required></textarea>
        <button type="submit" class="assistant-send-btn" data-assistant-send aria-label="Send">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 12l16-7-6 16-2.5-6.5L4 12z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="assistant-send-btn assistant-stop-btn" data-assistant-stop hidden aria-label="Stop">
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="5" y="5" width="14" height="14" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="assistant-composer-footer">
        <button type="button" class="assistant-text-btn" data-assistant-speak-toggle aria-pressed="false">Read replies aloud: off</button>
        <button type="button" class="assistant-text-btn" data-assistant-contact-toggle>Talk to our admissions team</button>
      </div>
    </form>
  </div>
</div>
