<link rel="stylesheet" href="/css/regalia.css?v=af55f443de">
<script>
(function(){
  try{
    var raw = localStorage.getItem('shrsPersonalisation');
    var p = raw ? JSON.parse(raw) : {};
    var html = document.documentElement;
    html.setAttribute('data-pc-theme', p.theme || 'light');
    html.setAttribute('data-pc-livery', p.livery || 'royal');
    html.setAttribute('data-pc-ornament', p.ornament || 'full');
    html.setAttribute('data-pc-corners', p.corners || 'soft');
    html.setAttribute('data-pc-depth', p.depth || 'standard');
    html.setAttribute('data-pc-grain', p.grain || 'on');
    html.setAttribute('data-pc-cursor', p.cursorLight || 'on');
    html.setAttribute('data-pc-parallax', p.parallax || 'on');
    html.setAttribute('data-pc-reveal', p.revealStyle || 'rise');
    html.setAttribute('data-pc-width', p.measure || 'standard');
    html.setAttribute('data-pc-press', p.letterpress || 'on');
    html.setAttribute('data-pc-motes', p.motes || 'on');
    html.setAttribute('data-pc-pagewipe', p.pageWipe || 'on');
    html.setAttribute('data-pc-ruler', p.readingRuler || 'off');
    html.setAttribute('data-pc-numerals', p.numerals || 'auto');
    html.setAttribute('data-pc-text', p.textSize || 'medium');
    html.setAttribute('data-pc-motion', p.motion || 'standard');
    html.setAttribute('data-pc-accent', p.accent || 'royal-gold');
    html.setAttribute('data-pc-reading', p.readingMode || 'standard');
    html.setAttribute('data-pc-text-density', p.textDensity || 'comfortable');
    html.setAttribute('data-pc-face', p.bodyFace || 'serif');
    html.setAttribute('data-pc-leading', p.leading || 'normal');
    html.setAttribute('data-pc-tracking', p.tracking || 'normal');
    html.setAttribute('data-pc-align', p.alignment || 'justified');
    html.setAttribute('data-pc-versal', p.versal || 'on');
    html.setAttribute('data-pc-arabic', p.arabicScale || 'standard');
    html.setAttribute('data-pc-contrast', p.contrast || 'standard');
    html.setAttribute('data-pc-links', p.links || 'hover');
    html.setAttribute('data-pc-focus', p.focusRing || 'standard');
    html.setAttribute('data-pc-imagery', p.imagery || 'full');
    html.setAttribute('data-pc-sound', p.interfaceSound || 'on');
    if(p.landingPage && p.landingPage !== 'home'){
      var path = location.pathname;
      if(path === '/' || path === '/ar/'){
        var lang = html.lang === 'ar' ? 'ar' : 'en';
        var targets = {
          en: { portal: '/portal/login/', admissions: '/admission/', quran: '/academics/quran-college/' },
          ar: { portal: '/portal/login/', admissions: '/ar/admission/', quran: '/ar/academics/quran-college/' },
        };
        var target = targets[lang][p.landingPage];
        if(target) location.replace(target);
      }
    }
  }catch(err){ /* localStorage unavailable (private mode etc.) — defaults apply */ }
})();
</script>
