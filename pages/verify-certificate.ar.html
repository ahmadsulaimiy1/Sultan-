<section class="academics" id="verify-certificate" dir="rtl">
  <div class="wrap">
    <span class="page-hero-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9.5 12.5l2 2 4-4.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 4h9l3 3v13H6V4z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg></span>
    <p class="eyebrow">التحقق من الشهادات والإجازات</p>
    <h2 style="margin-top:10px;">تحقق من شهادة</h2>
    <p style="max-width:660px;color:rgba(248,244,233,0.78);margin-top:12px;">تأكد من أن شهادة أو إجازة صادرة عن مدارس السلطان حنفي الملكية أصلية — أدخل الرقم المرجعي المطبوع على المستند، أو امسح رمز الاستجابة السريعة (QR) الخاص به. هذا يبحث في سجل شؤون التسجيل الحي؛ النتيجة هنا تعكس سجل المدرسة نفسه في هذه اللحظة، وليست نسخة.</p>
  </div>

  <div class="wrap">
    <form class="cert-verify-form" data-cert-verify-form dir="ltr">
      <input type="text" data-cert-verify-input placeholder="e.g. SHR-HFZ-2026-000001" aria-label="رقم الشهادة أو الإجازة المرجعي" required />
      <button type="submit" class="btn-gold">تحقق</button>
    </form>
    <div data-cert-verify-result></div>
  </div>
</section>
